[package]
name = "bson-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Pure-compute BSON structural decoder + Extended-JSON v2 codec (ported verbatim from Query-farm vgi-bson, no Arrow / no VGI deps)"

[dependencies]
bson = { version = "3.1.0", default-features = false, features = ["compat-3-0-0", "serde", "serde_json-1"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
